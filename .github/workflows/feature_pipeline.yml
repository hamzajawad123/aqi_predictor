
name: Feature Pipeline (Hourly)

on:
  schedule:
    - cron: "0 * * * *"   # Every hour
  workflow_dispatch:

jobs:
  run-feature-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Verify NumPy and PyArrow
        run: |
          python -c "import numpy; print('NumPy:', numpy.__version__)"
          python -c "import pyarrow; print('PyArrow:', pyarrow.__version__)"
          python -c "import pandas; print('Pandas:', pandas.__version__)"

      - name: Run feature pipeline
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME }}
          FEATURE_GROUP_VERSION: "4"
          FEATURE_VIEW_NAME: ${{ secrets.FEATURE_VIEW_NAME }}
        run: python -m src.feature_pipeline
