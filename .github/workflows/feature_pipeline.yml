name: Feature Pipeline (Hourly)

on:
  schedule:
    - cron: "0 * * * *"   # every hour, at minute 0
  workflow_dispatch:        # allows manual trigger from the Actions tab

jobs:
  run-feature-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run feature pipeline
        env:
          OPENWEATHER_API_KEY: ${{ secrets.OPENWEATHER_API_KEY }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME }}
          # Pin here — this is not a secret. An old FEATURE_GROUP_VERSION
          # repo secret was sending inserts into a pre-delta group.
          FEATURE_GROUP_VERSION: "4"
          FEATURE_VIEW_NAME: ${{ secrets.FEATURE_VIEW_NAME }}
        run: python -m src.feature_pipeline
