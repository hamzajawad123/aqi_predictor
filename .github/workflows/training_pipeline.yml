name: Training Pipeline (Daily)

on:
  schedule:
    - cron: "0 2 * * *"   # once a day at 02:00 UTC
  workflow_dispatch:

jobs:
  run-training-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 60   # LSTM training can take longer than the feature pipeline

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run training pipeline
        env:
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT_NAME: ${{ secrets.HOPSWORKS_PROJECT_NAME }}
          FEATURE_GROUP_VERSION: "4"
          FEATURE_VIEW_NAME: ${{ secrets.FEATURE_VIEW_NAME }}
        run: python -m src.training_pipeline

      - name: Upload SHAP + loss curve + comparison artifacts
        uses: actions/upload-artifact@v4
        with:
          name: training-report-${{ github.run_number }}
          path: |
            reports/shap_summary_24h.png
            reports/shap_summary_48h.png
            reports/shap_summary_72h.png
            reports/lstm_loss_curve.png
            reports/gru_loss_curve.png
            reports/model_comparison.csv
            reports/model_comparison_stratified.csv
            reports/model_comparison_by_horizon.csv
          if-no-files-found: ignore